<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Chery Uzbekistan</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #d32f2f;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 22px; margin: 0; }
        .header p { font-size: 13px; color: #888; margin-top: 5px; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .main-img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .card-body { padding: 18px; }
        .card-title { font-size: 20px; font-weight: 700; margin: 0 0 6px 0; }
        .price { font-size: 16px; color: var(--accent-color); font-weight: bold; margin-bottom: 15px; }

        .btn-buy {
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚗 Chery Uzbekistan</h1>
        <p>Rasmiy avtosalon modeli</p>
    </div>

    <div class="card">
        <!-- Tayyor rasmiy internet havolasidagi rasm -->
        <img class="main-img" src="https://images.hdqwalls.com/wallpapers/chery-tiggo-7-pro-2020-4k-zs.jpg" alt="Chery Tiggo 7 Pro">
        
        <div class="card-body">
            <div class="card-title">Chery Tiggo 7 Pro</div>
            <div class="price">299,900,000 UZS dan</div>
            <button class="btn-buy" onclick="Telegram.WebApp.close()">Shartnoma olish</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
